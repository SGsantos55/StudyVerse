name: Django Migrations

on:
  push:
    branches:
      - main  # This will trigger the workflow on every push to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest  # This runs on an Ubuntu virtual machine

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # This action checks out your repository code

    - name: Set up Python
      uses: actions/setup-python@v2  # Sets up Python environment
      with:
        python-version: '3.10'  # Make sure this version matches the one you're using in Railway

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # Install all dependencies from your requirements.txt

    - name: Run Migrations
      run: |
        python manage.py migrate  # This runs the migrations on your deployed Railway project
